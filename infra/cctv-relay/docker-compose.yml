services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: ecotrend-mediamtx
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MTX_AUTHMETHOD: internal
      MTX_AUTHINTERNALUSERS_0_USER: any
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_ACTION: read
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_1_ACTION: playback
      MTX_AUTHINTERNALUSERS_1_USER: ${PUBLISH_USER}
      MTX_AUTHINTERNALUSERS_1_PASS: ${PUBLISH_PASS}
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_ACTION: publish
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_PATH: ${STREAM_PATH}
      MTX_PATHDEFAULTS_SOURCE: publisher
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
      - "8554:8554"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  caddy:
    image: caddy:2
    container_name: ecotrend-cctv-caddy
    restart: unless-stopped
    depends_on:
      - mediamtx
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
